[package]
name = "dns-switch"
version = "0.1.0"
description = "DNS Switch - A cross-platform DNS switcher application"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
